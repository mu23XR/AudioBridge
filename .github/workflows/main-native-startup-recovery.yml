name: Recover main native startup
on:
  push:
    branches: [maintenance/main-native-input-inspect-20261112]
    paths: [.github/workflows/main-native-startup-recovery.yml]
permissions:
  contents: read
  actions: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify the obsolete lease and dispatch the unchanged main native tests once
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.request
          base="https://api.github.com/repos/mu23XR/AudioBridge"
          expected="a5857b18e06a02294f4203b22390c83e8e602f54"
          obsolete="ee9c0af9d432287ad94f61a40670cf613d2cf26f"
          def api(path,method="GET",data=None):
              payload=None if data is None else json.dumps(data).encode("utf-8")
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json",
                       "X-GitHub-Api-Version":"2022-11-28"}
              if payload is not None:
                  headers["Content-Type"]="application/json"
              with urllib.request.urlopen(urllib.request.Request(base+path,data=payload,headers=headers,method=method),timeout=30) as r:
                  body=r.read()
                  return json.loads(body) if body else {}
          assert os.environ["GITHUB_RUN_ID"]!="43096226396", "Obsolete recovery must never dispatch"
          assert api("/git/ref/heads/main")["object"]["sha"]==expected and expected!=obsolete
          old=api("/actions/runs/43096226396")
          assert old["head_sha"]=="666832402cb6d607c5cfa89a27970a80d1e23d30"
          assert api("/actions/runs/43096226396/jobs?per_page=1")["total_count"]==0
          definition=api("/contents/.github/workflows/main-native-startup-recovery.yml?ref="+old["head_sha"])
          text=base64.b64decode(definition["content"]).decode("utf-8")
          lease='assert api("/git/ref/heads/main")["object"]["sha"]=="'+obsolete+'"'
          post='api("/actions/runs/43090517310/rerun","POST")'
          assert "\n          "+lease in text and text.index(lease)<text.index(post), "Old source lease not verified"
          print("OBSOLETE_RECOVERY_FENCED old_run=43096226396 expected_old_main="+obsolete,flush=True)
          recent=api("/actions/runs?event=workflow_dispatch&head_sha="+expected+"&per_page=20")["workflow_runs"]
          existing=[r for r in recent if r["path"]==".github/workflows/android-native.yml" and r["created_at"]>="2026-11-11T20:11:00Z"]
          assert len(existing)<=1, "Multiple native dispatches require inspection"
          if existing:
              print("EXISTING_NATIVE_RUN "+str(existing[0]["id"])+" source="+expected,flush=True)
          else:
              assert api("/git/ref/heads/main")["object"]["sha"]==expected, "Main moved before dispatch"
              api("/actions/workflows/388312461/dispatches","POST",{"ref":"main"})
              print("NATIVE_MAIN_DISPATCHED_ONCE source="+expected,flush=True)
          api("/actions/workflows/415130389/disable","PUT")
          print("TEMPORARY_RECOVERY_WORKFLOW_DISABLED id=415130389",flush=True)
          PY
