name: Recover main native startup
on:
  push:
    branches: [maintenance/main-native-input-inspect-20261112]
    paths: [.github/workflows/main-native-startup-recovery.yml]
permissions:
  contents: read
  checks: read
  actions: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect startup metadata then restart only the terminal native workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.request, urllib.error
          base="https://api.github.com/repos/mu23XR/AudioBridge"
          def api(path,method="GET"):
              request=urllib.request.Request(base+path,method=method,
                  headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                           "Accept":"application/vnd.github+json",
                           "X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(request,timeout=30) as response:
                  body=response.read()
                  return json.loads(body) if body else {}
          run=api("/actions/runs/43090517310")
          assert run["run_attempt"]==2 and run["status"]=="completed" and run["conclusion"]=="startup_failure"
          assert run["head_sha"]=="36a3343454b8cf00872f51fbd7d554a7ab31c933"
          assert run["path"]==".github/workflows/android-native.yml" and run["event"]=="push"
          assert api("/actions/runs/43090517310/attempts/2/jobs?per_page=1")["total_count"]==0
          assert api("/git/ref/heads/main")["object"]["sha"]=="ee9c0af9d432287ad94f61a40670cf613d2cf26f"
          suite=api("/check-suites/116691164132")
          assert suite["head_sha"]==run["head_sha"]
          print("STARTUP_SUITE",json.dumps({k:suite.get(k) for k in ("id","status","conclusion","latest_check_runs_count")}),flush=True)
          checks=api("/check-suites/116691164132/check-runs?filter=all&per_page=100")["check_runs"]
          for check in checks:
              print("STARTUP_CHECK",json.dumps({k:check.get(k) for k in ("id","name","status","conclusion","output")}),flush=True)
          view=subprocess.run(["gh","run","view","43090517310","--attempt","2","--repo","mu23XR/AudioBridge"],
                              stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=60)
          print("STARTUP_VIEW_EXIT",view.returncode,flush=True)
          print("STARTUP_VIEW",view.stdout.decode("utf-8")[:6000],view.stderr.decode("utf-8")[:2000],flush=True)
          # Restart the one-job workflow graph; failed-job selection produced no jobs.
          # This endpoint is allowed for terminal startup failures and never changes refs.
          api("/actions/runs/43090517310/rerun","POST")
          print("FULL_NATIVE_WORKFLOW_RESTART_REQUESTED_ONCE original_run=43090517310 source="+run["head_sha"],flush=True)
          PY
