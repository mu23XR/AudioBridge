name: Inspect PR75 root native failure

on:
  push:
    branches: [maintenance/pr75-native-inspect-20261112]
    paths: [.github/workflows/pr75-native-inspect.yml]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read only the exact original failed native report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, re, subprocess, tarfile, zipfile
          prefix = 'repos/mu23XR/AudioBridge'
          def read(path):
              return json.loads(subprocess.check_output(['gh', 'api', prefix + path]))
          release = read('/releases/442094628')
          expected = {'schema':'audiobridge-release-stage-v1','repository':'mu23XR/AudioBridge',
              'scope':'native','source':'b6fd39a386378c950402e893e693f7ba505ce068','run':'43078426312'}
          assert release['draft'] and json.loads(release['body']) == expected
          asset = next(a for a in release['assets'] if a['id'] == 736605942)
          data = subprocess.check_output(['gh','api','-H','Accept: application/octet-stream',prefix+'/releases/assets/736605942'])
          assert len(data) == 1414688
          assert hashlib.sha256(data).hexdigest() == '2ece56eb8ebbb9cc3cefb8e8d857b1fd036f64a0b428cdb7b585c4263a02d678'
          with zipfile.ZipFile(io.BytesIO(data)) as report:
              for name in ('failure.txt','host-memory-before.txt','host-memory-after.txt','emulator-version.txt','audio-path-live.json'):
                  print('REPORT:', name, report.read(name).decode('utf-8')[:6000])
              lines = report.read('logcat.txt').decode('utf-8').splitlines()
              phase = [line for line in lines if 'PLAYOUT_FIXTURE' in line and 'adaptive-sole-before-silence' in line]
              print('FAILED PHASE:', '\n'.join(phase))
              bounds = [int(re.search(r'wallMs=(\d+)',line).group(1)) for line in phase if ' START ' in line or ' END ' in line]
              assert len(bounds)==2
              with tarfile.open(fileobj=io.BytesIO(report.read('runtime-journal.tar'))) as journal:
                  entry = journal.getmember('files/diagnostics/runtime.log')
                  assert entry.size < 16*1024*1024
                  text = journal.extractfile(entry).read().decode('utf-8')
                  for line in text.splitlines():
                      match = re.search(r'wall=(\d+)',line)
                      if match and bounds[0]-250 <= int(match.group(1)) <= bounds[1]+100:
                          print('JOURNAL:',line)
          PY
