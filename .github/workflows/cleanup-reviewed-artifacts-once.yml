name: One-time reviewed Actions artifact cleanup

on:
  push:
    branches: [ "maintenance/actions-storage-cleanup-20261105" ]
    paths:
      - ".github/workflows/cleanup-reviewed-artifacts-once.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: reviewed-artifact-cleanup-20261105
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'mu23XR/AudioBridge' && github.ref == 'refs/heads/maintenance/actions-storage-cleanup-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preflight exact artifact IDs, delete duplicate packages and verify storage
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import collections
          import json
          import os
          import urllib.error
          import urllib.request
          
          REPO = "mu23XR/AudioBridge"
          PLAN = json.loads("[{\"id\":12560503591,\"name\":\"AudioBridge-Desktop-Windows\",\"bytes\":292562384,\"run\":40095151417,\"sha\":\"a40463d3198b1c16cc243201578ac340f51b452f\",\"branch\":\"fix/desktop-burst-playout\"},{\"id\":12559493513,\"name\":\"AudioBridge-Desktop-Windows\",\"bytes\":292561699,\"run\":40093640207,\"sha\":\"5f0cad4fb75c0656de0e21d6cac21b8ff24fffe5\",\"branch\":\"fix/desktop-burst-playout\"},{\"id\":12553427127,\"name\":\"AudioBridge-Desktop-Windows\",\"bytes\":292556488,\"run\":40076184631,\"sha\":\"0c7394e5eca15b77c26d1fbb5094f8671a1a5361\",\"branch\":\"publish/desktop-receive-preview\"},{\"id\":12553320696,\"name\":\"AudioBridge-Desktop-Windows\",\"bytes\":292557199,\"run\":40075136207,\"sha\":\"3fc718ab1d6bfe9b64c153ce384434653119c78b\",\"branch\":\"publish/desktop-receive-preview\"},{\"id\":12552686961,\"name\":\"AudioBridge-Desktop-Windows\",\"bytes\":292554418,\"run\":40073998118,\"sha\":\"b4d1d1b564e02f7c8dd4d6c9f99aa16bc8260d0d\",\"branch\":\"publish/desktop-receive-preview\"}]")
          EXPECTED_RELEASE = 434110405
          HEADERS = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "AudioBridge-one-time-artifact-cleanup",
              "Cache-Control": "no-cache",
          }
          
          def api(method, path, missing_ok=False):
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + REPO + path,
                  headers=HEADERS, method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read()
                      if method == "DELETE":
                          if response.status != 204:
                              raise RuntimeError("DELETE returned " + str(response.status))
                          return True
                      return json.loads(data)
              except urllib.error.HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  raise RuntimeError(method + " " + path + " failed: HTTP " + str(error.code)) from None
          
          def inventory():
              found = []
              for page in range(1, 1001):
                  result = api("GET", "/actions/artifacts?per_page=100&page=" + str(page))
                  batch = result["artifacts"]
                  found.extend(batch)
                  if len(batch) < 100:
                      return found
              raise RuntimeError("Artifact pagination limit reached")
          
          def totals(items):
              live = [item for item in items if not item["expired"]]
              return {"count": len(live), "bytes": sum(item["size_in_bytes"] for item in live)}
          
          def release_fingerprint():
              release = api("GET", "/releases/tags/v2.0.1")
              if release["id"] != EXPECTED_RELEASE or release["draft"] or release["prerelease"]:
                  raise RuntimeError("Unexpected stable release identity")
              assets = release["assets"]
              if len(assets) != 9:
                  raise RuntimeError("Expected all nine stable release assets")
              fingerprint = {
                  "release_id": release["id"],
                  "assets": sorted((a["id"], a["name"], a["size"], a.get("digest")) for a in assets),
                  "tag": api("GET", "/git/ref/tags/v2.0.1")["object"],
              }
              return fingerprint
          
          if os.environ.get("GITHUB_REPOSITORY") != REPO:
              raise RuntimeError("Unexpected repository")
          if len({p["id"] for p in PLAN}) != len(PLAN):
              raise RuntimeError("Duplicate artifact IDs in plan")
          
          protected_release = release_fingerprint()
          before = inventory()
          by_id = {a["id"]: a for a in before}
          native_before = {a["id"]: a.get("digest") for a in before if a["name"].startswith("android-native-")}
          selected = []
          absent = []
          checked_runs = {}
          allowed_names = {"AudioBridge-Desktop-Windows"}
          
          # Validate the whole plan before the first irreversible API request.
          for expected in PLAN:
              artifact = by_id.get(expected["id"])
              if artifact is None or artifact["expired"]:
                  absent.append(expected["id"])
                  continue
              run_ref = artifact["workflow_run"]
              if (
                  artifact["name"] != expected["name"]
                  or artifact["name"] not in allowed_names
                  or artifact["size_in_bytes"] != expected["bytes"]
                  or run_ref["id"] != expected["run"]
                  or run_ref["head_sha"] != expected["sha"]
                  or run_ref["head_branch"] != expected["branch"]
              ):
                  raise RuntimeError("Artifact preflight mismatch: " + str(expected["id"]))
              if expected["run"] not in checked_runs:
                  checked_runs[expected["run"]] = api("GET", "/actions/runs/" + str(expected["run"]))
              run = checked_runs[expected["run"]]
              if (
                  run["status"] != "completed"
                  or run["head_sha"] != expected["sha"]
                  or run["head_branch"] != expected["branch"]
                  or run["repository"]["full_name"] != REPO
              ):
                  raise RuntimeError("Run preflight mismatch: " + str(expected["run"]))
              selected.append(expected)
          
          print("CLEANUP_BEFORE=" + json.dumps(totals(before)), flush=True)
          print("CLEANUP_ALREADY_ABSENT=" + json.dumps(absent), flush=True)
          print("CLEANUP_SELECTED=" + json.dumps(selected), flush=True)
          deleted = []
          for expected in selected:
              result = api("DELETE", "/actions/artifacts/" + str(expected["id"]), missing_ok=True)
              if result is None:
                  absent.append(expected["id"])
                  continue
              if api("GET", "/actions/artifacts/" + str(expected["id"]), missing_ok=True) is not None:
                  raise RuntimeError("Artifact still accessible after DELETE: " + str(expected["id"]))
              deleted.append(expected)
              print("DELETED " + str(expected["id"]) + " " + str(expected["bytes"]) + " " + expected["name"], flush=True)
          
          after = inventory()
          after_ids = {a["id"] for a in after}
          if any(a["id"] in after_ids for a in deleted):
              raise RuntimeError("Deleted artifacts still listed after cleanup")
          if protected_release != release_fingerprint():
              raise RuntimeError("Stable release fingerprint changed during cleanup")
          native_after = {a["id"]: a.get("digest") for a in after if a["name"].startswith("android-native-")}
          if native_after != native_before:
              raise RuntimeError("Native diagnostics changed concurrently; inspect before reporting success")
          
          by_name = collections.defaultdict(lambda: {"count": 0, "bytes": 0})
          for artifact in after:
              if not artifact["expired"]:
                  by_name[artifact["name"]]["count"] += 1
                  by_name[artifact["name"]]["bytes"] += artifact["size_in_bytes"]
          report = {
              "repository": REPO,
              "before": totals(before),
              "after": totals(after),
              "deleted_count": len(deleted),
              "deleted_bytes": sum(a["bytes"] for a in deleted),
              "deleted_ids": [a["id"] for a in deleted],
              "already_absent_ids": absent,
              "native_diagnostics_preserved": len(native_after),
              "stable_release_id": EXPECTED_RELEASE,
              "stable_assets_preserved": 9,
              "remaining_by_name": dict(sorted(by_name.items())),
          }
          print("CLEANUP_RESULT=" + json.dumps(report, sort_keys=True), flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("# One-time Actions artifact cleanup\n\n")
              summary.write("Only reviewed duplicate installation packages were selected. Native diagnostics, runs, source and stable release assets were preserved.\n\n")
              summary.write("| Metric | Before | After |\n|---|---:|---:|\n")
              summary.write("| Live artifacts | " + str(report["before"]["count"]) + " | " + str(report["after"]["count"]) + " |\n")
              summary.write("| Stored bytes | " + str(report["before"]["bytes"]) + " | " + str(report["after"]["bytes"]) + " |\n\n")
              summary.write("Deleted " + str(report["deleted_count"]) + " artifacts / " + str(report["deleted_bytes"]) + " bytes.\n\n")
              summary.write("This is current repository artifact storage; it does not reset accrued account billing usage.\n")
