name: One-time reviewed Actions artifact cleanup

on:
  push:
    branches: [ "maintenance/actions-storage-cleanup-20261105" ]
    paths:
      - ".github/workflows/cleanup-reviewed-artifacts-once.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: reviewed-artifact-cleanup-20261105
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'mu23XR/AudioBridge' && github.ref == 'refs/heads/maintenance/actions-storage-cleanup-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preflight exact artifact IDs, delete duplicate packages and verify storage
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import collections
          import json
          import os
          import urllib.error
          import urllib.request
          
          REPO = "mu23XR/AudioBridge"
          PLAN = json.loads("[{\"id\":13339465410,\"name\":\"stable-android\",\"bytes\":25016768,\"run\":41857316658,\"sha\":\"4cbea4a97b73554ca8f9260bc211736916b12154\"},{\"id\":13337738049,\"name\":\"verified-stable-bundle\",\"bytes\":317687939,\"run\":41857316658,\"sha\":\"4cbea4a97b73554ca8f9260bc211736916b12154\"},{\"id\":13337274610,\"name\":\"stable-windows\",\"bytes\":292667634,\"run\":41857316658,\"sha\":\"4cbea4a97b73554ca8f9260bc211736916b12154\"},{\"id\":13337488605,\"name\":\"AudioBridge-Desktop-Windows\",\"bytes\":292673155,\"run\":41857316583,\"sha\":\"4cbea4a97b73554ca8f9260bc211736916b12154\"},{\"id\":13339010963,\"name\":\"AudioBridge-Android-Preview-1.3.1-test.21\",\"bytes\":25016791,\"run\":41857316634,\"sha\":\"4cbea4a97b73554ca8f9260bc211736916b12154\"},{\"id\":13337638182,\"name\":\"AudioBridge-Desktop-Windows\",\"bytes\":146440068,\"run\":41857316634,\"sha\":\"4cbea4a97b73554ca8f9260bc211736916b12154\"},{\"id\":13338160496,\"name\":\"verified-stable-bundle\",\"bytes\":317689270,\"run\":41854450945,\"sha\":\"953c13b3d35d829211ae8a13334925f1047403e3\"},{\"id\":13337401850,\"name\":\"stable-android\",\"bytes\":25016603,\"run\":41854450945,\"sha\":\"953c13b3d35d829211ae8a13334925f1047403e3\"},{\"id\":13335839951,\"name\":\"stable-windows\",\"bytes\":292669127,\"run\":41854450945,\"sha\":\"953c13b3d35d829211ae8a13334925f1047403e3\"},{\"id\":13336767098,\"name\":\"AudioBridge-Desktop-Windows\",\"bytes\":292673333,\"run\":41854451079,\"sha\":\"953c13b3d35d829211ae8a13334925f1047403e3\"},{\"id\":13338455216,\"name\":\"AudioBridge-Android-Preview-1.3.1-test.21\",\"bytes\":25016897,\"run\":41854451420,\"sha\":\"953c13b3d35d829211ae8a13334925f1047403e3\"},{\"id\":13335969623,\"name\":\"AudioBridge-Desktop-Windows\",\"bytes\":146440129,\"run\":41854451420,\"sha\":\"953c13b3d35d829211ae8a13334925f1047403e3\"},{\"id\":12818872409,\"name\":\"stable-windows\",\"bytes\":292667860,\"run\":40694640480,\"sha\":\"5916b75bc127de3193d30a239e5b93af2297d23e\"},{\"id\":12818304402,\"name\":\"stable-android\",\"bytes\":25013780,\"run\":40694640480,\"sha\":\"5916b75bc127de3193d30a239e5b93af2297d23e\"},{\"id\":12818348539,\"name\":\"AudioBridge-Desktop-Windows\",\"bytes\":292672643,\"run\":40694640393,\"sha\":\"5916b75bc127de3193d30a239e5b93af2297d23e\"},{\"id\":12818805253,\"name\":\"stable-windows\",\"bytes\":292668241,\"run\":40692598888,\"sha\":\"fbeff3b11ff41a06d70e4485229b3c00310b4439\"},{\"id\":12818062299,\"name\":\"stable-android\",\"bytes\":25013789,\"run\":40692598888,\"sha\":\"fbeff3b11ff41a06d70e4485229b3c00310b4439\"},{\"id\":12817603838,\"name\":\"verified-stable-bundle\",\"bytes\":317685477,\"run\":40692598888,\"sha\":\"fbeff3b11ff41a06d70e4485229b3c00310b4439\"},{\"id\":12817897708,\"name\":\"AudioBridge-Desktop-Windows\",\"bytes\":292672739,\"run\":40692598713,\"sha\":\"fbeff3b11ff41a06d70e4485229b3c00310b4439\"},{\"id\":12671550237,\"name\":\"stable-android\",\"bytes\":25013811,\"run\":40366103499,\"sha\":\"c8d2f9ddeff4d9e6a13493ab3903065eea70b222\"},{\"id\":12671740002,\"name\":\"AudioBridge-Desktop-Windows\",\"bytes\":292671814,\"run\":40366103943,\"sha\":\"c8d2f9ddeff4d9e6a13493ab3903065eea70b222\"},{\"id\":12670330519,\"name\":\"stable-android\",\"bytes\":25014021,\"run\":40363868966,\"sha\":\"457473d53316fc9a0ca1bbef2ca48155fdff91cc\"},{\"id\":12668823614,\"name\":\"stable-windows\",\"bytes\":292666318,\"run\":40363868966,\"sha\":\"457473d53316fc9a0ca1bbef2ca48155fdff91cc\"},{\"id\":12670605094,\"name\":\"AudioBridge-Desktop-Windows\",\"bytes\":292674425,\"run\":40363868487,\"sha\":\"457473d53316fc9a0ca1bbef2ca48155fdff91cc\"},{\"id\":12668358345,\"name\":\"stable-windows\",\"bytes\":292666895,\"run\":40362368659,\"sha\":\"f738991e8321d836de935928a17beb86b0e24030\"},{\"id\":12668133368,\"name\":\"stable-android\",\"bytes\":25013970,\"run\":40362368659,\"sha\":\"f738991e8321d836de935928a17beb86b0e24030\"},{\"id\":12648063906,\"name\":\"stable-windows\",\"bytes\":292669420,\"run\":40319490062,\"sha\":\"a8a534fda2563bc9aadacc881b7b232e8fef2598\"},{\"id\":12647964707,\"name\":\"stable-android\",\"bytes\":25013947,\"run\":40319490062,\"sha\":\"a8a534fda2563bc9aadacc881b7b232e8fef2598\"},{\"id\":12648162934,\"name\":\"AudioBridge-Desktop-Windows\",\"bytes\":292670961,\"run\":40319489965,\"sha\":\"a8a534fda2563bc9aadacc881b7b232e8fef2598\"}]")
          HEAD_BRANCH = "release/2.0.1"
          EXPECTED_RELEASE = 434110405
          HEADERS = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "AudioBridge-one-time-artifact-cleanup",
              "Cache-Control": "no-cache",
          }
          
          def api(method, path, missing_ok=False):
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + REPO + path,
                  headers=HEADERS, method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read()
                      if method == "DELETE":
                          if response.status != 204:
                              raise RuntimeError("DELETE returned " + str(response.status))
                          return True
                      return json.loads(data)
              except urllib.error.HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  raise RuntimeError(method + " " + path + " failed: HTTP " + str(error.code)) from None
          
          def inventory():
              found = []
              for page in range(1, 1001):
                  result = api("GET", "/actions/artifacts?per_page=100&page=" + str(page))
                  batch = result["artifacts"]
                  found.extend(batch)
                  if len(batch) < 100:
                      return found
              raise RuntimeError("Artifact pagination limit reached")
          
          def totals(items):
              live = [item for item in items if not item["expired"]]
              return {"count": len(live), "bytes": sum(item["size_in_bytes"] for item in live)}
          
          def release_fingerprint():
              release = api("GET", "/releases/tags/v2.0.1")
              if release["id"] != EXPECTED_RELEASE or release["draft"] or release["prerelease"]:
                  raise RuntimeError("Unexpected stable release identity")
              assets = release["assets"]
              if len(assets) != 9:
                  raise RuntimeError("Expected all nine stable release assets")
              fingerprint = {
                  "release_id": release["id"],
                  "assets": sorted((a["id"], a["name"], a["size"], a.get("digest")) for a in assets),
                  "tag": api("GET", "/git/ref/tags/v2.0.1")["object"],
              }
              return fingerprint
          
          if os.environ.get("GITHUB_REPOSITORY") != REPO:
              raise RuntimeError("Unexpected repository")
          if len({p["id"] for p in PLAN}) != len(PLAN):
              raise RuntimeError("Duplicate artifact IDs in plan")
          
          protected_release = release_fingerprint()
          before = inventory()
          by_id = {a["id"]: a for a in before}
          native_before = {a["id"]: a.get("digest") for a in before if a["name"].startswith("android-native-")}
          selected = []
          absent = []
          checked_runs = {}
          allowed_names = {
              "stable-android", "stable-windows", "verified-stable-bundle",
              "AudioBridge-Desktop-Windows", "AudioBridge-Android-Preview-1.3.1-test.21",
          }
          
          # Validate the whole plan before the first irreversible API request.
          for expected in PLAN:
              artifact = by_id.get(expected["id"])
              if artifact is None or artifact["expired"]:
                  absent.append(expected["id"])
                  continue
              run_ref = artifact["workflow_run"]
              if (
                  artifact["name"] != expected["name"]
                  or artifact["name"] not in allowed_names
                  or artifact["size_in_bytes"] != expected["bytes"]
                  or run_ref["id"] != expected["run"]
                  or run_ref["head_sha"] != expected["sha"]
                  or run_ref["head_branch"] != HEAD_BRANCH
              ):
                  raise RuntimeError("Artifact preflight mismatch: " + str(expected["id"]))
              if expected["run"] not in checked_runs:
                  checked_runs[expected["run"]] = api("GET", "/actions/runs/" + str(expected["run"]))
              run = checked_runs[expected["run"]]
              if (
                  run["status"] != "completed"
                  or run["head_sha"] != expected["sha"]
                  or run["head_branch"] != HEAD_BRANCH
                  or run["repository"]["full_name"] != REPO
              ):
                  raise RuntimeError("Run preflight mismatch: " + str(expected["run"]))
              selected.append(expected)
          
          print("CLEANUP_BEFORE=" + json.dumps(totals(before)), flush=True)
          print("CLEANUP_ALREADY_ABSENT=" + json.dumps(absent), flush=True)
          print("CLEANUP_SELECTED=" + json.dumps(selected), flush=True)
          deleted = []
          for expected in selected:
              result = api("DELETE", "/actions/artifacts/" + str(expected["id"]), missing_ok=True)
              if result is None:
                  absent.append(expected["id"])
                  continue
              if api("GET", "/actions/artifacts/" + str(expected["id"]), missing_ok=True) is not None:
                  raise RuntimeError("Artifact still accessible after DELETE: " + str(expected["id"]))
              deleted.append(expected)
              print("DELETED " + str(expected["id"]) + " " + str(expected["bytes"]) + " " + expected["name"], flush=True)
          
          after = inventory()
          after_ids = {a["id"] for a in after}
          if any(a["id"] in after_ids for a in deleted):
              raise RuntimeError("Deleted artifacts still listed after cleanup")
          if protected_release != release_fingerprint():
              raise RuntimeError("Stable release fingerprint changed during cleanup")
          native_after = {a["id"]: a.get("digest") for a in after if a["name"].startswith("android-native-")}
          if native_after != native_before:
              raise RuntimeError("Native diagnostics changed concurrently; inspect before reporting success")
          
          by_name = collections.defaultdict(lambda: {"count": 0, "bytes": 0})
          for artifact in after:
              if not artifact["expired"]:
                  by_name[artifact["name"]]["count"] += 1
                  by_name[artifact["name"]]["bytes"] += artifact["size_in_bytes"]
          report = {
              "repository": REPO,
              "before": totals(before),
              "after": totals(after),
              "deleted_count": len(deleted),
              "deleted_bytes": sum(a["bytes"] for a in deleted),
              "deleted_ids": [a["id"] for a in deleted],
              "already_absent_ids": absent,
              "native_diagnostics_preserved": len(native_after),
              "stable_release_id": EXPECTED_RELEASE,
              "stable_assets_preserved": 9,
              "remaining_by_name": dict(sorted(by_name.items())),
          }
          print("CLEANUP_RESULT=" + json.dumps(report, sort_keys=True), flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("# One-time Actions artifact cleanup\n\n")
              summary.write("Only reviewed duplicate installation packages were selected. Native diagnostics, runs, source and stable release assets were preserved.\n\n")
              summary.write("| Metric | Before | After |\n|---|---:|---:|\n")
              summary.write("| Live artifacts | " + str(report["before"]["count"]) + " | " + str(report["after"]["count"]) + " |\n")
              summary.write("| Stored bytes | " + str(report["before"]["bytes"]) + " | " + str(report["after"]["bytes"]) + " |\n\n")
              summary.write("Deleted " + str(report["deleted_count"]) + " artifacts / " + str(report["deleted_bytes"]) + " bytes.\n\n")
              summary.write("This is current repository artifact storage; it does not reset accrued account billing usage.\n")
