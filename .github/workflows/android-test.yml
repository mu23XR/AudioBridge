name: Build Android Test APK

on:
  pull_request:
    paths:
      - "docs/releases/build-request.json"
  push:
    tags:
      - "v*-test.*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit to build"
        required: true
        default: "main"
        type: string
      version_name:
        description: "Prerelease version, for example 1.3.1-test.14"
        required: true
        type: string
      artifact_name:
        description: "Artifact base name"
        required: false
        default: "AudioBridge-Android-Preview"
        type: string

permissions:
  contents: read

concurrency:
  group: android-test-${{ inputs.source_ref || github.ref }}-${{ inputs.version_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/desktop-windows.yml
    with:
      source_ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.ref }}
      version_name: ${{ inputs.version_name || (github.event_name == 'push' && github.ref_name) || '' }}

  governance:
    uses: ./.github/workflows/governance.yml
    with:
      source_ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.ref }}

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - name: Checkout requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.ref }}

      - name: Validate test version
        id: version
        env:
          VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          PUBLISH_TEST=false
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            VERSION_NAME=$(python3 -c 'import json; print(json.load(open("docs/releases/build-request.json"))["version"])')
            PUBLISH_TEST=$(python3 -c 'import json; print("true" if json.load(open("docs/releases/build-request.json")).get("publish") is True else "false")')
          elif [[ "$EVENT_NAME" == "push" ]]; then
            PUBLISH_TEST=true
          fi
          VERSION_NAME="${VERSION_NAME#v}"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+$ ]]; then
            echo "Test versions must match MAJOR.MINOR.PATCH-test.N; got: $VERSION_NAME"
            exit 1
          fi
          echo "TEST_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH_TEST" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Resolve shared Android version code
        run: |
          set -euo pipefail
          VERSION_NAME="$TEST_VERSION_NAME"
          YEAR=$(date -u +%Y)
          OFFSET=$((10#$YEAR - 2020))
          STAMP=$(date -u +%m%d%H%M)
          CODE=$((OFFSET * 100000000 + 10#$STAMP))
          if (( OFFSET < 0 || OFFSET > 20 || CODE <= 0 || CODE > 2100000000 )); then
            echo "Generated Android versionCode is outside the supported range: $CODE"
            exit 1
          fi
          echo "WFAS_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "WFAS_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Restore permanent signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"

          mkdir -p "$GITHUB_WORKSPACE/.ci"
          KEYSTORE="$GITHUB_WORKSPACE/.ci/audiobridge-release.jks"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          EXPECTED="4DDF267D25A73F0A28446C9E77293204E32F6777C63417FEB7BD925040FEFB63"
          ACTUAL=$(keytool -list -v             -keystore "$KEYSTORE"             -storepass "$SIGNING_STORE_PASSWORD"             -alias "$SIGNING_KEY_ALIAS"             | awk -F': ' '/SHA256:/ { gsub(":","",$2); print toupper($2); exit }')

          echo "Signing certificate SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          echo "AUDIOBRIDGE_SIGNING_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "AUDIOBRIDGE_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AUDIOBRIDGE_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AUDIOBRIDGE_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run Android unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        working-directory: android
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build signed standalone test APK
        working-directory: android
        run: ./gradlew :app:assemblePreview --stacktrace

      - name: Verify APK signer and collect asset
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name || 'AudioBridge-Android-Preview' }}
        run: |
          set -euo pipefail
          SRC="android/app/build/outputs/apk/preview/app-preview.apk"
          test -f "$SRC"

          EXPECTED="4DDF267D25A73F0A28446C9E77293204E32F6777C63417FEB7BD925040FEFB63"
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$SRC"             | awk -F': ' '/certificate SHA-256 digest:/ { gsub(":","",$2); print toupper($2); exit }')
          echo "APK signer SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          mkdir -p release-assets
          OUT="$ARTIFACT_NAME-$TEST_VERSION_NAME.apk"
          cp "$SRC" "release-assets/$OUT"
          (
            cd release-assets
            sha256sum "$OUT" > "$OUT.sha256"
          )
          git rev-parse HEAD > release-assets/SOURCE_COMMIT.txt

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'AudioBridge-Android-Preview' }}-${{ env.TEST_VERSION_NAME }}
          path: release-assets/*
          retention-days: 1
          if-no-files-found: error

  publish:
    if: needs.build.outputs.publish == 'true'
    needs: [build, windows, governance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p publish-assets
          find release-assets -type f \( -name '*.apk' -o -name '*.zip' -o -name 'SOURCE_COMMIT.txt' \) -exec cp {} publish-assets/ \;
          test -n "$(find publish-assets -name '*.apk' -print -quit)"
          test -n "$(find publish-assets -name '*.zip' -print -quit)"
          SOURCE_SHA=$(cat publish-assets/SOURCE_COMMIT.txt)
          (cd publish-assets && sha256sum * > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --prerelease --latest=false --title "AudioBridge $RELEASE_TAG" \
            --notes-file "docs/releases/${RELEASE_TAG#v}.md" publish-assets/*
