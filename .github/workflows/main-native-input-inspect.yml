name: Inspect original main native input failure
on:
  push:
    branches: [maintenance/main-native-input-inspect-20261112]
    paths: [.github/workflows/main-native-input-inspect.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read only the run-source-hash verified original report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, re, subprocess, tarfile, zipfile
          prefix = 'repos/mu23XR/AudioBridge'
          def read(path):
              return json.loads(subprocess.check_output(['gh','api',prefix+path]))
          release = read('/releases/442149942')
          expected = {'schema':'audiobridge-release-stage-v1','repository':'mu23XR/AudioBridge',
                      'scope':'native','source':'36a3343454b8cf00872f51fbd7d554a7ab31c933','run':'43090517310'}
          assert release['draft'] and json.loads(release['body']) == expected
          asset = next(a for a in release['assets'] if a['id'] == 736777219)
          assert asset['name'] == 'diagnostics-attempt-1-native-diagnostics.zip'
          data = subprocess.check_output(['gh','api','-H','Accept: application/octet-stream',prefix+'/releases/assets/736777219'])
          assert len(data) == 1407866
          assert hashlib.sha256(data).hexdigest() == '216990589e6b7dc38e776080e87382b38480f7cae537a1f1fa1069f973fba2ca'
          start, finish = 1794426926880 - 1000, 1794426926880 + 1700
          with zipfile.ZipFile(io.BytesIO(data)) as report:
              print('VERIFIED ORIGINAL REPORT', len(data), hashlib.sha256(data).hexdigest())
              print('FILES', report.namelist())
              for name in ('failure.txt','host-memory-before.txt','host-memory-after.txt','audio-path-live.json'):
                  print('REPORT', name, report.read(name).decode('utf-8')[:5500])
              for name in report.namelist():
                  if 'instrumentation' in name and name.endswith(('.txt','.stdout','.stderr')):
                      lines = report.read(name).decode('utf-8',errors='strict').splitlines()
                      indices = {j for i,line in enumerate(lines) if
                          any(k in line for k in ('Paced PCM','Fixture producer','pendingPackets','Caused by:'))
                          for j in range(max(0,i-2),min(len(lines),i+8))}
                      print('INSTRUMENTATION', name)
                      for j in sorted(indices):
                          print(lines[j])
              lines = report.read('logcat.txt').decode('utf-8').splitlines()
              for line in lines:
                  if 'PLAYOUT_FIXTURE' in line and ('maxLagUs=88164' in line or
                      any(('wallMs='+str(t)) in line for t in ())):
                      print('FAILED PRODUCER SAMPLE', line)
                  if any(k in line for k in ('Fixture producer stalled','pendingPackets=','Paced PCM producer failed')):
                      print('ORIGINAL LOG FAILURE',line)
              with tarfile.open(fileobj=io.BytesIO(report.read('runtime-journal.tar'))) as journal:
                  entry=journal.getmember('files/diagnostics/runtime.log')
                  assert entry.size<16*1024*1024
                  text=journal.extractfile(entry).read().decode('utf-8')
                  for line in text.splitlines():
                      match=re.search(r'wall=(\d+)',line)
                      if match and start<=int(match.group(1))<=finish:
                          print('JOURNAL',line)
              # Only phase metadata or scheduling/GC lines around the failed producer epoch.
              for line in lines:
                  if 'PLAYOUT_FIXTURE' in line:
                      wall=re.search(r'wallMs=(\d+)',line)
                      if wall and start<=int(wall.group(1))<=finish:
                          print('FAILED PHASE',line)
                  if line.startswith('11-11 19:55:2') and any(k in line for k in
                      ('GC','suspend','Slow','Skipped','Choreographer','CPU','ANR','throttl')):
                      print('SYSTEM WINDOW',line)
          PY
