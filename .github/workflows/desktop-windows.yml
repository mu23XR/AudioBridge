name: Validate Desktop Windows

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ""
      version_name:
        type: string
        default: ""
      stage_scope:
        description: "Run-bound draft Release scope supplied by the preview caller"
        type: string
        default: ""
    outputs:
      source:
        value: ${{ jobs.windows.outputs.source }}
      manifest:
        value: ${{ jobs.windows.outputs.manifest }}
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the explicit Windows preview request after all checks"
        type: boolean
        default: false
  push:
    branches: [ "main" ]
    paths:
      - "desktop/**"
      - "WFAS_PROTOCOL.md"
      - ".github/workflows/desktop-windows.yml"
      - "scripts/desktop_preview.py"
      - "scripts/test_desktop_preview.py"
      - "scripts/release_stage.py"
      - "scripts/preview_release.py"
      - "scripts/tests/test_release_stage.py"
      - "scripts/tests/test_preview_release.py"
      - "scripts/check-wasapi-lifecycle.ps1"
      - "docs/releases/desktop-preview.json"
  pull_request:
    paths:
      - "desktop/**"
      - "WFAS_PROTOCOL.md"
      - ".github/workflows/desktop-windows.yml"
      - "scripts/desktop_preview.py"
      - "scripts/test_desktop_preview.py"
      - "scripts/release_stage.py"
      - "scripts/preview_release.py"
      - "scripts/tests/test_release_stage.py"
      - "scripts/tests/test_preview_release.py"
      - "scripts/check-wasapi-lifecycle.ps1"
      - "docs/releases/desktop-preview.json"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: desktop-windows-${{ github.workflow }}-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    env:
      # Reusable workflows inherit the caller's event, including pull_request.
      WFAS_REUSABLE_BUILD: ${{ inputs.source_ref != '' || inputs.version_name != '' || inputs.stage_scope != '' }}
    outputs:
      source: ${{ steps.preview.outputs.source || steps.reusable.outputs.source }}
      version: ${{ steps.preview.outputs.version }}
      publish: ${{ steps.preview.outputs.publish }}
      manifest: ${{ steps.stage.outputs.manifest || steps.reusable-stage.outputs.manifest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate publication request and clean exact source
        if: env.WFAS_REUSABLE_BUILD != 'true'
        id: preview
        working-directory: .
        run: python scripts/desktop_preview.py prepare --allow-publish "$env:ALLOW_PUBLISH"
        env:
          ALLOW_PUBLISH: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

      - name: Resolve reusable Android test version
        if: env.WFAS_REUSABLE_BUILD == 'true'
        id: reusable
        working-directory: .
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version_name }}
        run: |
          $version = $env:REQUESTED_VERSION.Trim()
          if ($version -eq '') {
            $request = Get-Content docs/releases/build-request.json -Raw | ConvertFrom-Json
            if ($request.version -isnot [string]) { throw 'Missing Android test version' }
            $version = $request.version.Trim()
          }
          $version = $version -creplace '^v', ''
          if ($version -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+$') {
            throw "Reusable Desktop builds require MAJOR.MINOR.PATCH-test.N: $version"
          }
          $source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve reusable source' }
          "WFAS_VERSION_NAME=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "source=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check preview verification and publication guards
        working-directory: .
        run: python scripts/test_desktop_preview.py
      - name: Test quota-independent transfer and preview identity guards
        working-directory: .
        run: python -m unittest discover -s scripts/tests

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Run Desktop checks
        run: .\gradlew.bat check

      - name: Generate versioned manual before packaging resources
        run: .\gradlew.bat generateMan

      - name: Build Windows portable package
        run: .\gradlew.bat createReleaseDistributable packagePortableArchives

      - name: Verify Windows preview identity and create checksums
        if: env.WFAS_REUSABLE_BUILD != 'true'
        working-directory: .
        run: python scripts/desktop_preview.py bundle --source "$env:SOURCE_SHA"
        env:
          SOURCE_SHA: ${{ steps.preview.outputs.source }}

      - name: Verify reusable test package identity
        if: env.WFAS_REUSABLE_BUILD == 'true'
        working-directory: .
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.reusable.outputs.source }}
        run: python scripts/preview_release.py windows --source "$env:SOURCE_SHA" --version "$env:WFAS_VERSION_NAME" --output out/reusable-windows

      - name: Prepare staging only for explicitly requested PC publication
        if: env.WFAS_REUSABLE_BUILD != 'true' && steps.preview.outputs.publish == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.preview.outputs.source }}
        run: python scripts/release_stage.py prepare --scope desktop --source "$env:SOURCE_SHA"
      - name: Transfer explicitly requested PC release files
        if: env.WFAS_REUSABLE_BUILD != 'true' && steps.preview.outputs.publish == 'true'
        id: stage
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.preview.outputs.source }}
        run: python scripts/release_stage.py upload --scope desktop --source "$env:SOURCE_SHA" --group windows --directory out/desktop-release
      - name: Transfer reusable Windows files through caller staging
        if: env.WFAS_REUSABLE_BUILD == 'true' && inputs.stage_scope != ''
        id: reusable-stage
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.reusable.outputs.source }}
          STAGE_SCOPE: ${{ inputs.stage_scope }}
        run: python scripts/release_stage.py upload --scope "$env:STAGE_SCOPE" --source "$env:SOURCE_SHA" --group windows --directory out/reusable-windows

  publish:
    needs: windows
    if: needs.windows.outputs.publish == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.windows.outputs.source }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download verified Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.windows.outputs.source }}
          STAGE_MANIFEST: ${{ needs.windows.outputs.manifest }}
        run: python scripts/release_stage.py download --scope desktop --source "$SOURCE_SHA" --output out/desktop-release

      - name: Verify uploaded assets and publish prerelease
        run: python scripts/desktop_preview.py publish --source "$SOURCE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.windows.outputs.source }}

  cleanup:
    needs: [windows, publish]
    if: always() && needs.windows.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.windows.outputs.source }}
          persist-credentials: false
      - name: Remove verified PC staging or retain failed-job retry inputs briefly
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.windows.outputs.source }}
          STAGE_OUTCOME: ${{ needs.publish.result }}
        run: python scripts/release_stage.py finish --scope desktop --source "$SOURCE_SHA"
