name: Build Desktop Windows

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ""
      version_name:
        type: string
        default: ""
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main" ]
    paths:
      - "desktop/**"
      - "WFAS_PROTOCOL.md"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  windows:
    env:
      WFAS_VERSION_NAME: ${{ inputs.version_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Resolve requested prerelease version
        if: github.event_name == 'pull_request' && inputs.source_ref != ''
        shell: pwsh
        run: |
          $request = Get-Content "$env:GITHUB_WORKSPACE/docs/releases/build-request.json" | ConvertFrom-Json
          "WFAS_VERSION_NAME=$($request.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Run Desktop checks
        run: .\gradlew.bat check

      - name: Build Windows portable package
        run: .\gradlew.bat createReleaseDistributable packagePortableArchives

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: AudioBridge-Desktop-Windows
          path: desktop/build/packages/*.zip
          retention-days: 3
          if-no-files-found: error
