name: Inspect original PR75 diagnostics

on:
  push:
    branches: [fix/pr75-acceptance-20261112]
    paths: [.github/workflows/pr75-diagnostics.yml]

permissions:
  # Draft visibility requires push-level contents access; the job only performs GETs.
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: mu23XR/AudioBridge
    steps:
      - name: Read the original failed native report without rerunning tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, re, subprocess, tarfile, zipfile
          release = json.loads(subprocess.check_output([
              'gh', 'api', 'repos/mu23XR/AudioBridge/releases/442019411']))
          expected = {'schema': 'audiobridge-release-stage-v1',
              'repository': 'mu23XR/AudioBridge', 'scope': 'native',
              'source': 'a31b308025634db38385c02f23a5b5336f215f06', 'run': '43069367138'}
          assert release['draft'] and release['tag_name'] == 'ci-stage-native-43069367138'
          assert json.loads(release['body']) == expected
          assets = release['assets']
          assert len(assets) == 1 and assets[0]['id'] == 736371495
          assert assets[0]['digest'] == 'sha256:7efcd51cc92bea450c70d65ca61aededc07c2c0fbb391abe9cb2f992b085bf49'
          data = subprocess.check_output(['gh', 'api', '-H', 'Accept: application/octet-stream',
              'repos/mu23XR/AudioBridge/releases/assets/736371495'])
          assert len(data) == 1347319
          assert hashlib.sha256(data).hexdigest() == assets[0]['digest'].removeprefix('sha256:')
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert len(archive.infolist()) < 4096
              print('Original diagnostic archive members:', archive.namelist())
              for item in archive.infolist():
                  if 'instrumentation' in item.filename or item.filename in {'failure.txt', 'result.json'}:
                      assert item.file_size < 2 * 1024 * 1024
                      print('\nREPORT:', item.filename)
                      print(archive.read(item).decode('utf-8')[-50000:])
              print('\nORIGINAL FAILED PHASE:')
              lines = archive.read('logcat.txt').decode('utf-8').splitlines()
              phase = [line for line in lines if 'PLAYOUT_FIXTURE' in line and 'adaptive-sole-before-silence' in line]
              print('\n'.join(phase))
              bounds = [int(re.search(r'wallMs=(\d+)', line).group(1)) for line in phase if ' START ' in line or ' END ' in line]
              assert len(bounds) == 2
              with tarfile.open(fileobj=io.BytesIO(archive.read('runtime-journal.tar'))) as journal:
                  entry = journal.getmember('files/diagnostics/runtime.log')
                  assert entry.size < 16 * 1024 * 1024
                  text = journal.extractfile(entry).read().decode('utf-8')
                  print('\nJOURNAL FORMAT SAMPLE:', text[:1500])
                  selected = []
                  for line in text.splitlines():
                      if any(marker in line.lower() for marker in ('discard', 'overflow', 'gap', 'slow', 'stall')):
                          selected.append(line)
                  print('\nJOURNAL LOSS/TIMING EVENTS:', '\n'.join(selected)[-90000:])
          PY
