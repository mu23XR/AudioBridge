name: Recover stalled PR75 SDK setup

on:
  push:
    branches: [maintenance/pr75-sdk-recovery-20261112]
    paths: [.github/workflows/pr75-sdk-recovery.yml]

permissions:
  contents: read
  actions: write

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel only the exact stalled nonpublishing run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, subprocess
          prefix = 'repos/mu23XR/AudioBridge'
          def read(path):
              return json.loads(subprocess.check_output(['gh', 'api', prefix + path]))
          run = read('/actions/runs/43078426312')
          assert run['head_sha'] == 'b6fd39a386378c950402e893e693f7ba505ce068'
          assert run['event'] == 'pull_request'
          assert any(pr['number'] == 75 for pr in run['pull_requests'])
          if run['status'] == 'completed':
              print('Original run already completed; no cancellation.')
          else:
              jobs = read('/actions/runs/43078426312/jobs?per_page=100')['jobs']
              job = next(j for j in jobs if j['id'] == 130724597842)
              active = [s for s in job['steps'] if s['status'] == 'in_progress']
              expected = 'Install SDK and create isolated API 35 emulator'
              if job['status'] != 'in_progress' or len(active) != 1 or active[0]['name'] != expected:
                  print('SDK stage has advanced; no cancellation.')
              else:
                  began = datetime.datetime.fromisoformat(active[0]['started_at'].replace('Z', '+00:00'))
                  age = (datetime.datetime.now(datetime.timezone.utc) - began).total_seconds()
                  assert age >= 600, 'SDK setup has not exceeded the recovery window'
                  print('SDK stage stalled for seconds:', round(age))
                  subprocess.run(['gh', 'api', '--method', 'POST', prefix + '/actions/runs/43078426312/cancel'], check=True)
                  print('Cancellation requested. All successful source-bound outputs are retained for job retry.')
          PY
