name: Publish or Promote AudioBridge Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: "prepare = build/publish prerelease; promote = convert existing prerelease to stable"
        required: true
        default: "prepare"
        type: choice
        options:
          - prepare
          - promote
      version:
        description: "Version without v, for example 1.4.0"
        required: true
        type: string
      source_ref:
        description: "Source branch/tag/commit used only for prepare"
        required: false
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.action == 'prepare'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Validate version and resolve source
        id: meta
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ inputs.source_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match MAJOR.MINOR.PATCH; got: $VERSION"
            exit 1
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Existing published versions are never overwritten."
            exit 1
          fi
          SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_REF" --jq .sha)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Create draft prerelease container
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --target "$SOURCE_SHA"             --title "AudioBridge $TAG"             --generate-notes             --draft             --prerelease
          printf '%s\n' "$SOURCE_SHA" > SOURCE_COMMIT.txt
          gh release upload "$TAG" SOURCE_COMMIT.txt --repo "$GITHUB_REPOSITORY"

  android:
    if: inputs.action == 'prepare'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Resolve Android version code
        run: |
          set -euo pipefail
          YEAR=$(date -u +%Y)
          OFFSET=$((10#$YEAR - 2020))
          STAMP=$(date -u +%m%d%H%M)
          CODE=$((OFFSET * 100000000 + 10#$STAMP))
          echo "WFAS_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "WFAS_VERSION_NAME=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Restore permanent signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          mkdir -p "$GITHUB_WORKSPACE/.ci"
          KEYSTORE="$GITHUB_WORKSPACE/.ci/audiobridge-release.jks"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          EXPECTED="4DDF267D25A73F0A28446C9E77293204E32F6777C63417FEB7BD925040FEFB63"
          ACTUAL=$(keytool -list -v -keystore "$KEYSTORE" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" | awk -F': ' '/SHA256:/ { gsub(":","",$2); print toupper($2); exit }')
          test "$ACTUAL" = "$EXPECTED"
          echo "AUDIOBRIDGE_SIGNING_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "AUDIOBRIDGE_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AUDIOBRIDGE_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AUDIOBRIDGE_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Test and build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Verify and upload Android asset directly to prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$SRC"
          EXPECTED="4DDF267D25A73F0A28446C9E77293204E32F6777C63417FEB7BD925040FEFB63"
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$SRC" | awk -F': ' '/certificate SHA-256 digest:/ { gsub(":","",$2); print toupper($2); exit }')
          test "$ACTUAL" = "$EXPECTED"
          OUT="AudioBridge-Android-$RELEASE_VERSION.apk"
          cp "$SRC" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          gh release upload "$RELEASE_TAG" "$OUT" "$OUT.sha256" --repo "$GITHUB_REPOSITORY"

  windows:
    if: inputs.action == 'prepare'
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      WFAS_VERSION_NAME: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-disabled: true

      - name: Check and build Windows package
        working-directory: desktop
        run: .\gradlew.bat check createReleaseDistributable packagePortableArchives

      - name: Upload Windows asset directly to prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem "$env:GITHUB_WORKSPACE\desktop\build\packages\*.zip" | Select-Object -First 1
          if (-not $zip) { throw "Windows ZIP not found" }
          $out = "$env:GITHUB_WORKSPACE\AudioBridge-$env:RELEASE_VERSION-windows-x86_64.zip"
          Copy-Item $zip.FullName $out -Force
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $out -Leaf)" | Set-Content "$out.sha256"
          gh release upload $env:RELEASE_TAG $out "$out.sha256" --repo $env:GITHUB_REPOSITORY

  publish:
    if: inputs.action == 'prepare'
    needs: [prepare, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false

  promote:
    if: inputs.action == 'promote'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote existing prerelease without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match MAJOR.MINOR.PATCH; got: $VERSION"
            exit 1
          fi
          TAG="v$VERSION"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --draft=false --latest
