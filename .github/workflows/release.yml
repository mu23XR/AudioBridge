name: Release Android + Windows

on:
  pull_request:
    paths:
      - "docs/releases/stable-build-request.json"
      - "docs/releases/2.0.1.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/android-native.yml"
      - "scripts/stable_release.py"
      - "scripts/release_stage.py"
      - "scripts/preview_release.py"
      - "scripts/tests/test_stable_release.py"
      - "scripts/tests/test_release_stage.py"
      - "scripts/tests/test_preview_release.py"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing stable tag, for example v2.0.1"
        type: string
      source_ref:
        description: "Exact source SHA, branch or tag (defaults to selected workflow ref)"
        type: string
      version:
        description: "Stable version without v; alternatively use release_tag"
        type: string
      publish:
        description: "Publish verified assets as stable/latest after all gates"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: stable-release-${{ github.ref }}
  # A new PR head supersedes an older authorized release candidate.
  cancel-in-progress: true

jobs:
  meta:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'push' || !contains(github.ref_name, '-'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      source: ${{ steps.request.outputs.source }}
      version: ${{ steps.request.outputs.version }}
      code: ${{ steps.request.outputs.code }}
      publish: ${{ steps.request.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.source_ref || inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Validate explicit request and pin one source/version/code
        id: request
        run: python3 scripts/stable_release.py prepare
      - name: Test stable and preview verification guards
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 scripts/test_desktop_preview.py
      - name: Exercise quota-independent Release transfer and cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_stage.py smoke --scope smoke --source "${{ steps.request.outputs.source }}"
      - name: Prepare private run-bound Release staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_stage.py prepare --scope stable --source "${{ steps.request.outputs.source }}"

  android:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      manifest: ${{ steps.stage.outputs.manifest }}
    env:
      WFAS_VERSION_NAME: ${{ needs.meta.outputs.version }}
      WFAS_VERSION_CODE: ${{ needs.meta.outputs.code }}
      SOURCE_SHA: ${{ needs.meta.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore and verify permanent signing identity
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          mkdir -p "$GITHUB_WORKSPACE/.ci"
          KEYSTORE="$GITHUB_WORKSPACE/.ci/audiobridge-release.jks"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          EXPECTED="4DDF267D25A73F0A28446C9E77293204E32F6777C63417FEB7BD925040FEFB63"
          ACTUAL=$(keytool -list -v -keystore "$KEYSTORE" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" | awk -F': ' '/SHA256:/ { gsub(":","",$2); print toupper($2); exit }')
          test "$ACTUAL" = "$EXPECTED"
          echo "AUDIOBRIDGE_SIGNING_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "AUDIOBRIDGE_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AUDIOBRIDGE_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AUDIOBRIDGE_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Android unit tests, strict lint and signed release build
        working-directory: android
        run: bash gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
      - name: Verify actual APK identity and collect exact-source Android asset
        run: |
          python3 scripts/stable_release.py android --source "$SOURCE_SHA" --version "$WFAS_VERSION_NAME" --code "$WFAS_VERSION_CODE" \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --output out/stable-android
      - name: Transfer verified Android files through run-bound draft Release
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_stage.py upload --scope stable --source "$SOURCE_SHA" --group android --directory out/stable-android
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.ci/audiobridge-release.jks"

  windows:
    needs: meta
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      manifest: ${{ steps.stage.outputs.manifest }}
    env:
      WFAS_VERSION_NAME: ${{ needs.meta.outputs.version }}
      SOURCE_SHA: ${{ needs.meta.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Full Windows checks
        working-directory: desktop
        run: .\gradlew.bat check
      - name: Generate versioned manual before packaging resources
        working-directory: desktop
        run: .\gradlew.bat generateMan
      - name: Build exact Windows ZIP and TAR
        working-directory: desktop
        run: .\gradlew.bat createReleaseDistributable packagePortableArchives
      - name: Verify stable JAR, native library, manual and matching archive bytes
        run: python scripts/stable_release.py windows --source "$env:SOURCE_SHA" --version "$env:WFAS_VERSION_NAME" --output out/stable-windows
      - name: Transfer verified Windows files through run-bound draft Release
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_stage.py upload --scope stable --source "$env:SOURCE_SHA" --group windows --directory out/stable-windows

  governance:
    needs: meta
    uses: ./.github/workflows/governance.yml
    with:
      source_ref: ${{ needs.meta.outputs.source }}

  native:
    needs: meta
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/android-native.yml
    with:
      source_ref: ${{ needs.meta.outputs.source }}

  release:
    needs: [meta, android, windows, governance, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: stable-publish-${{ needs.meta.outputs.version }}
      cancel-in-progress: false
    env:
      SOURCE_SHA: ${{ needs.meta.outputs.source }}
      RELEASE_VERSION: ${{ needs.meta.outputs.version }}
      VERSION_CODE: ${{ needs.meta.outputs.code }}
      NATIVE_SOURCE: ${{ needs.native.outputs.source_sha }}
      ANDROID_MANIFEST: ${{ needs.android.outputs.manifest }}
      WINDOWS_MANIFEST: ${{ needs.windows.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Confirm native gate checked the same integration source
        run: test "$NATIVE_SOURCE" = "$SOURCE_SHA"
      - name: Download and hash the exact platform job outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_stage.py download --scope stable --source "$SOURCE_SHA" --manifest "$ANDROID_MANIFEST" --output out/stable-input
          python3 scripts/release_stage.py download --scope stable --source "$SOURCE_SHA" --manifest "$WINDOWS_MANIFEST" --output out/stable-input
      - name: Verify unified identity, source, provenance and checksums
        run: |
          python3 scripts/stable_release.py bundle --source "$SOURCE_SHA" --version "$RELEASE_VERSION" --code "$VERSION_CODE" \
            --input out/stable-input --output out/stable-release
      - name: Publish immutable assets, download-verify, then mark stable/latest
        if: needs.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/stable_release.py publish --source "$SOURCE_SHA" --version "$RELEASE_VERSION" --output out/stable-release

  cleanup:
    needs: [meta, android, windows, governance, native, release]
    if: always() && needs.meta.outputs.source != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.source }}
          persist-credentials: false
      - name: Remove verified staging or retain failed-job retry inputs briefly
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.meta.outputs.source }}
          STAGE_OUTCOME: ${{ needs.release.result }}
        run: python3 scripts/release_stage.py finish --scope stable --source "$SOURCE_SHA"
