name: Release Android + Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to release, for example v1.4.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-')
    name: Build signed Android release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate stable tag and resolve version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable releases require an exact vMAJOR.MINOR.PATCH tag; got: $RELEASE_TAG"
            exit 1
          fi

          NAME="${RELEASE_TAG#v}"

          # One global, time-based Android versionCode scheme shared across
          # test/stable workflows. Encodes (year-2020) + MMDDHHMM and remains
          # below Android's versionCode limit through 2040.
          YEAR=$(date -u +%Y)
          OFFSET=$((10#$YEAR - 2020))
          STAMP=$(date -u +%m%d%H%M)
          CODE=$((OFFSET * 100000000 + 10#$STAMP))
          if (( OFFSET < 0 || OFFSET > 20 || CODE <= 0 || CODE > 2100000000 )); then
            echo "Generated Android versionCode is outside the supported range: $CODE"
            exit 1
          fi

          echo "WFAS_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "WFAS_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "WFAS_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "WFAS_ANDROID_ARTIFACT=AudioBridge-Android-$NAME" >> "$GITHUB_ENV"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore permanent signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"

          mkdir -p "$GITHUB_WORKSPACE/.ci"
          KEYSTORE="$GITHUB_WORKSPACE/.ci/audiobridge-release.jks"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          EXPECTED="4DDF267D25A73F0A28446C9E77293204E32F6777C63417FEB7BD925040FEFB63"
          ACTUAL=$(keytool -list -v             -keystore "$KEYSTORE"             -storepass "$SIGNING_STORE_PASSWORD"             -alias "$SIGNING_KEY_ALIAS"             | awk -F': ' '/SHA256:/ { gsub(":","",$2); print toupper($2); exit }')

          echo "Signing certificate SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          echo "AUDIOBRIDGE_SIGNING_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "AUDIOBRIDGE_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AUDIOBRIDGE_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AUDIOBRIDGE_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run Android unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Android lint (report existing debt)
        continue-on-error: true
        working-directory: android
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build Android release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK signer and collect asset
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          EXPECTED="4DDF267D25A73F0A28446C9E77293204E32F6777C63417FEB7BD925040FEFB63"
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"             | awk -F': ' '/certificate SHA-256 digest:/ { gsub(":","",$2); print toupper($2); exit }')

          echo "APK signer SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          mkdir -p release-assets
          cp "$APK" "release-assets/$WFAS_ANDROID_ARTIFACT.apk"
          git rev-parse HEAD > release-assets/SOURCE_COMMIT.txt

      - name: Upload Android release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/*
          retention-days: 1
          if-no-files-found: error

  windows:
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-')
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Validate stable tag and resolve version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Stable releases require vMAJOR.MINOR.PATCH: $env:RELEASE_TAG"
          }
          "WFAS_VERSION_NAME=$($env:RELEASE_TAG.Substring(1))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Run Desktop checks
        working-directory: desktop
        run: .\gradlew.bat check

      - name: Build Windows portable package
        working-directory: desktop
        run: .\gradlew.bat createReleaseDistributable packagePortableArchives

      - name: Collect Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\release-assets" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\desktop\build\packages\*.zip" "$env:GITHUB_WORKSPACE\release-assets\" -Force

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*.zip
          retention-days: 1
          if-no-files-found: error

  governance:
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-')
    uses: ./.github/workflows/governance.yml
    with:
      source_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

  release:
    name: Publish unified release
    needs: [android, windows, governance]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate release checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "AudioBridge $RELEASE_TAG" --latest \
            --notes-file "docs/releases/${RELEASE_TAG#v}.md" release-assets/*
