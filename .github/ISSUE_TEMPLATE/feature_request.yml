name: Feature request
description: Propose a new AudioBridge capability or UX improvement
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What user problem should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior, not just an implementation.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Android SEND / Shizuku
        - Android RECEIVE
        - Audio routing / volume
        - WFAS protocol / networking
        - Latency / buffering
        - Desktop
        - Build / release / signing
        - UI / settings
        - Other
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Compatibility, latency, battery, no-root, privacy, migration, or other constraints.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this feature to be considered complete?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
